<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/a11y-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('https://images.pexels.com/photos/4612307/pexels-photo-4612307.jpeg') center/cover no-repeat fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 10, 40, 0.35);
            z-index: -1;
        }

        .post-title {
            padding-top: 20px;
            color: #ff8e5e;
            font-size: 2.1em;
            margin: 0 0 12px 0;
            position: relative;
        }

        .post-title::after {
            content: "";
            display: block;
            width: 100%;
            height: 6px;
            background: repeating-linear-gradient(
                to right,
                #ff8e5e,
                #ff8e5e 6px,
                transparent 6px,
                transparent 14px
            );
            margin-top: 8px;
        }

        .post-date {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 35px;
        }

        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4 {
            color: #f0f0f0;
            margin-top: 2.2em;
        }

        blockquote {
            border-left: 6px solid #ff8e5e;
            margin: 30px 0;
            padding: 8px 25px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            font-style: italic;
            color: #ddd;
        }

        blockquote p {
            margin: 0;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }
        ul li {
            padding-left: 8px;
            margin-bottom: 8px;
        }
        ul li::before {
            content: "- ";
            color: #2fb5ae;
        }
        code {
            color: #2fb5ae;
        }

        a {
            color: #4dd0ff;
            text-decoration: underline;
        }

        a:hover {
            color: #80e0ff;
        }

        pre {
            overflow-x: auto;
            white-space: pre;
            scrollbar-width: thin;
            scrollbar-color: #ff8e5e #2a2a3a;
            border-radius: 8px;
            padding: 16px 20px;
            background: #1e1e2e;
            margin: 1.5em 0;
            position: relative;
        }

        pre code {
            display: block;
            min-width: max-content;
        }

        pre .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #2a2a3a;
            color: #ff8e5e;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        pre:hover .copy-btn {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="/elm.js"></script>


<script>
    function startApp() {
        if (typeof Elm !== "undefined") {
            Elm.Main.init({ node: document.getElementById("app") });
        } else {
            setTimeout(startApp, 10);
        }
    }

    function initHighlighting() {
        const app = document.getElementById("app");
        if (!app) return;
        const observer = new MutationObserver(() => hljs.highlightAll());
        observer.observe(app, { childList: true, subtree: true });
    }

    function addAnchorLinks() {
        const headings = document.querySelectorAll('h1');
        headings.forEach(h => {
            if (h.querySelector('.anchor')) return;

            const text = h.textContent.trim();
            const id = text
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');

            if (!id) return;

            h.id = id;

            const anchor = document.createElement('a');
            anchor.href = '#' + id;
            anchor.className = 'anchor';
            anchor.innerHTML = '&nbsp;#';
            anchor.style.marginLeft = '12px';
            anchor.style.color = '#ff8e5e';
            anchor.style.textDecoration = 'none';
            anchor.style.fontSize = '0.8em';
            anchor.style.opacity = '0.7';

            h.appendChild(anchor);
        });
    }

    function addCopyButtons() {
        document.querySelectorAll('pre').forEach(pre => {
            if (pre.querySelector('.copy-btn')) return;

            const btn = document.createElement('button');
            btn.className = 'copy-btn';
            btn.textContent = 'copy';
            btn.onclick = () => {
                const code = pre.querySelector('code').textContent;
                navigator.clipboard.writeText(code).then(() => {
                    btn.textContent = 'copied!';
                    setTimeout(() => { btn.textContent = 'copy'; }, 2000);
                });
            };
            pre.appendChild(btn);
        });
    }

    window.addEventListener("load", () => {
        startApp();
        initHighlighting();

        let attempts = 0;
        const interval = setInterval(() => {
            attempts++;
            addAnchorLinks();
            addCopyButtons();
            if (attempts > 40) clearInterval(interval);
        }, 60);

        if (window.location.hash) {
            setTimeout(() => {
                const target = document.querySelector(window.location.hash);
                if (target) target.scrollIntoView({ behavior: "smooth" });
            }, 500);
        }
    });
</script>

</body>
</html>
